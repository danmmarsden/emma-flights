name: Update Flight Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate latest flight data
        run: |
          for attempt in 1 2 3; do
            if node scripts/generate-data.js; then
              exit 0
            fi
            echo "Flight data generation attempt ${attempt} failed; retrying..."
            sleep 15
          done
          exit 1

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Update flight data"

      - name: Push changes
        run: git push
