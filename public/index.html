<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>LBA Flight Tracker</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="hero">
        <h1>LBA Flight Tracker</h1>

        <div class="controls">
          <div class="view-toggle" aria-label="Flight type toggle">
            <button id="departuresToggle" class="view-toggle-button is-active" type="button">Departures</button>
            <button id="arrivalsToggle" class="view-toggle-button" type="button">Arrivals</button>
          </div>

          <div class="roster-toggle" aria-label="Roster tools">
            <button id="rosterSelectToggle" class="roster-toggle-button" type="button">Roster select</button>
            <button id="myRosterToggle" class="roster-toggle-button" type="button">My roster</button>
          </div>

          <label class="toggle">
            <input id="jet2Only" type="checkbox">
            <span>Jet2 only</span>
          </label>

          <label class="toggle">
            <input id="showCompleted" type="checkbox">
            <span>Show completed</span>
          </label>
        </div>

        <div class="meta-row">
          <p id="statusText" class="status-text">Loading flights...</p>
        </div>
      </section>

      <section id="results" class="results-grid" aria-live="polite"></section>
      <p id="sourceText" class="source-text source-footer"></p>
    </main>

    <template id="dayTemplate">
      <article class="day-card">
        <div class="day-header">
          <div class="day-title">
            <p class="day-label"></p>
            <div class="date-nav" aria-label="Day navigation">
              <button class="date-nav-button previous-day-button" type="button" aria-label="Previous day">&lt;</button>
              <h2 class="day-date"></h2>
              <button class="date-nav-button next-day-button" type="button" aria-label="Next day">&gt;</button>
              <button class="today-button" type="button">Today →</button>
            </div>
          </div>
        </div>

        <div class="tables">
          <section class="table-card departures-section">
            <div class="table-header">
              <h3>Departures</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
	                    <th>Flight</th>
	                    <th>Airline</th>
	                    <th>Destination</th>
	                    <th>Status</th>
	                    <th>Info</th>
	                  </tr>
                </thead>
                <tbody class="departures-body"></tbody>
              </table>
            </div>
          </section>

          <section class="table-card arrivals-section">
            <div class="table-header">
              <h3>Arrivals</h3>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
	                    <th>Flight</th>
	                    <th>Airline</th>
	                    <th>Origin</th>
	                    <th>Status</th>
	                    <th>Info</th>
	                  </tr>
                </thead>
                <tbody class="arrivals-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </article>
    </template>

    <template id="rosterTemplate">
      <article class="day-card roster-card">
        <div class="day-header">
          <div>
            <p class="day-label">Saved sectors</p>
            <h2 class="day-date">My Roster</h2>
          </div>
          <div class="roster-view-controls" aria-label="Roster view">
            <button class="roster-view-button is-active" type="button" data-roster-view="table">List</button>
            <button class="roster-view-button" type="button" data-roster-view="calendar">Calendar</button>
            <span class="pill roster-pill"></span>
          </div>
        </div>
        <p class="roster-storage-note">Roster is saved on this device.</p>
        <form class="roster-import-form">
          <label class="roster-import-label" for="rosterCalendarUrl">RosterBuster WebCal</label>
          <input id="rosterCalendarUrl" class="roster-import-input" type="url" inputmode="url" autocomplete="off" placeholder="https://rosterbuster.com/ical/private/...">
          <button class="roster-import-button" type="submit">Import</button>
          <p class="roster-import-status" aria-live="polite"></p>
        </form>

        <div class="tables">
          <section class="table-card roster-section">
            <div class="table-header">
              <h3>Roster</h3>
              <span class="pill roster-table-pill"></span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Flight</th>
                    <th>Airline</th>
                    <th>Route</th>
                    <th>Status</th>
                    <th>Info</th>
                  </tr>
                </thead>
                <tbody class="roster-body"></tbody>
              </table>
            </div>
          </section>

          <section class="table-card roster-calendar-section" hidden>
            <div class="table-header">
              <div class="calendar-nav" aria-label="Calendar month navigation">
                <button class="calendar-nav-button" type="button" data-calendar-step="-1" aria-label="Previous month">&lt;</button>
                <h3 class="roster-calendar-month"></h3>
                <button class="calendar-nav-button" type="button" data-calendar-step="1" aria-label="Next month">&gt;</button>
              </div>
            </div>
            <div class="roster-calendar-grid"></div>
          </section>
        </div>
      </article>
    </template>

    <dialog id="flightModal" class="flight-modal">
      <div class="flight-modal-card">
        <button id="closeFlightModalButton" class="flight-modal-close" type="button" aria-label="Close details">Close</button>
        <p id="flightModalEyebrow" class="flight-modal-eyebrow"></p>
        <h2 id="flightModalTitle" class="flight-modal-title"></h2>
        <p id="flightModalSubtitle" class="flight-modal-subtitle"></p>
        <div id="flightModalGrid" class="flight-modal-grid"></div>
      </div>
    </dialog>

    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
